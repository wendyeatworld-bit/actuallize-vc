<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actualize</title>
<meta name="description" content="Actualize is a seed fund. The internet helped people find the work. AI does the work. We back the founders building it.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='18' text-anchor='middle' fill='%23000'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root{ --bg:#ffffff; --ink:#000000; --muted:#7a7a7a; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#000; --ink:#fff; --muted:#8a8a8a; }
  }
  :root[data-theme="dark"]{ --bg:#000; --ink:#fff; --muted:#8a8a8a; }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:12px; line-height:1.7; letter-spacing:.08em; text-transform:uppercase;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  a{color:inherit; text-decoration:none}
  a:hover{opacity:.5}

  header{padding:34px 24px; text-align:center}
  .mark{font-size:15px; letter-spacing:.32em; font-weight:400}

  .photo{display:block; width:100%; max-width:1200px; margin:0 auto; padding:0 24px}
  .photo img{display:block; width:100%; height:auto; aspect-ratio:3/2; object-fit:cover}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:64px 24px 80px}
  h1{
    font-weight:400; font-size:12px; line-height:2.1; letter-spacing:.14em;
    margin:0 auto; max-width:30em; text-align:center;
  }
  h1 span{display:block}
  h1 .us{color:var(--muted)}

  footer{padding:0 24px 34px; text-align:center; font-size:10px; letter-spacing:.18em; color:var(--muted)}
  footer a{margin:0 14px}
  footer .city{margin-top:14px}
</style>
</head>
<body>

<header><a class="mark" href="/">ACTUALIZE</a></header>

<div class="photo">
  <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3FBEx7ug8c43FUmaHQZoDa0OQAV/hf_20261027_184140_202189ca-5938-49e7-ab62-c8498d952d9e.png" alt="" width="1024" height="688">
</div>

<main>
  <h1>
    <span>The internet helped people find the work.</span>
    <span>AI does the work.</span>
    <span class="us">We back the founders building it.</span>
  </h1>
</main>

<footer>
  <div>
    <a href="mailto:hello@actualize.vc">Email</a>
    <a href="https://wendyxiao26.substack.com" target="_blank" rel="noopener">Substack</a>
    <a href="https://x.com/wendy_xiao26" target="_blank" rel="noopener">X</a>
  </div>
  <div class="city">Seed Fund &nbsp;·&nbsp; New York</div>
</footer>

</body>
</html>
